name: 抓取卡池并部署 Pages

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "忽略卡池结束时间，强制抓取所选游戏"
        required: true
        type: boolean
        default: true
      games:
        description: "手动刷新游戏，填 all 或 zzz,sr,ww,ys,arknights,endfield"
        required: true
        type: string
        default: "all"
      persist_data:
        description: "抓取成功后提交数据（与定时任务相同的数据落库行为）"
        required: true
        type: boolean
        default: true
  schedule:
    # GitHub Actions 使用 UTC；常规维护对应北京时间/新加坡时间 08:00、12:00、16:00、20:00。
    - cron: "0 0,4,8,12 * * *"
    # 明日方舟数据每天只抓取一次，对应北京时间/新加坡时间 09:00。
    - cron: "0 1 * * *"
  push:
    branches:
      - main
    paths:
      - "spider/**"
      - "web/**"
      - ".github/workflows/main.yml"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 阶段一：判断本次是否需要抓取、要抓哪些游戏，并算出抓取矩阵。
  prepare:
    name: 准备维护窗口
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip pages]')
    runs-on: ubuntu-latest
    outputs:
      should_crawl: ${{ steps.plan.outputs.should_crawl }}
      should_build: ${{ steps.plan.outputs.should_build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      games: ${{ steps.plan.outputs.games }}
      reason: ${{ steps.plan.outputs.reason }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spider/requirements.txt

      - name: 判断是否进入卡池维护窗口
        if: github.event_name != 'push'
        id: maintenance
        working-directory: spider
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_update }}
          FORCE_GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || 'auto' }}
          SCHEDULE_CRON: ${{ github.event_name == 'schedule' && github.event.schedule || '' }}
        run: python should_update.py

      - name: 计算抓取矩阵
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHOULD_RUN: ${{ steps.maintenance.outputs.should_run }}
          GAMES: ${{ steps.maintenance.outputs.games }}
          REASON: ${{ steps.maintenance.outputs.reason }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            should_crawl=false
            should_build=true
            echo "push 事件只构建站点，跳过爬虫。"
          else
            should_crawl="${SHOULD_RUN:-false}"
            if [ "$EVENT_NAME" != "schedule" ] || [ "$should_crawl" = "true" ]; then
              should_build=true
            else
              should_build=false
            fi
          fi

          matrix=$(GAMES="$GAMES" python -c \
            'import json, os; print(json.dumps([g.strip() for g in os.environ.get("GAMES", "").split(",") if g.strip()]))')
          {
            echo "should_crawl=$should_crawl"
            echo "should_build=$should_build"
            echo "matrix=$matrix"
            echo "games=$GAMES"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          echo "should_crawl=$should_crawl should_build=$should_build matrix=$matrix"
          echo "$REASON"

  # 阶段二：按游戏并行抓取。每个游戏独立 runner、独立超时，
  # fail-fast: false 保证某个游戏失败/卡住不会中断其他游戏的抓取。
  crawl:
    name: 抓取 ${{ matrix.game }}
    needs: prepare
    if: needs.prepare.outputs.should_crawl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # Secret 作为回退值；终末地步骤成功后会把自动获取的设备标识写入 GITHUB_ENV 覆盖它。
      ENDFIELD_DEVICE_ID: ${{ secrets.ENDFIELD_DEVICE_ID }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spider/requirements.txt

      - name: 安装爬虫依赖
        working-directory: spider
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        if: matrix.game == 'endfield'
        working-directory: spider
        run: playwright install --with-deps chromium

      - name: 获取终末地设备标识
        if: matrix.game == 'endfield'
        working-directory: spider
        run: |
          # 优先自动获取设备标识；失败时保留 Secret 回退值。
          if device_id=$(python get_endfield_device_id.py); then
            echo "::add-mask::$device_id"
            echo "ENDFIELD_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          else
            echo "自动获取设备标识失败，使用 ENDFIELD_DEVICE_ID Secret 回退。"
          fi
          avatar_map_file="$RUNNER_TEMP/endfield-avatar-map.json"
          if python get_endfield_device_id.py --avatars > "$avatar_map_file"; then
            echo "ENDFIELD_AVATAR_MAP_FILE=$avatar_map_file" >> "$GITHUB_ENV"
          else
            echo '{}' > "$avatar_map_file"
            echo "自动获取终末地角色头像映射失败，使用接口字段回退。"
          fi

      - name: 检查爬虫语法
        working-directory: spider
        run: python -m compileall spider run_spider.py should_update.py crawl_artifacts.py

      - name: 抓取 ${{ matrix.game }} 卡池
        # 兜底超时：单个游戏正常 1~5 分钟。上游接口不可用时到点判失败，
        # 不影响其他游戏的 job，也不会占死 pages 并发组数小时。
        timeout-minutes: 20
        working-directory: spider
        run: python run_spider.py --games "${{ matrix.game }}" --allow-empty "endfield/history"

      - name: 收集本次变更
        if: always()
        working-directory: spider
        run: python crawl_artifacts.py collect --game "${{ matrix.game }}" --staging "$RUNNER_TEMP/crawl-out"

      - name: 上传抓取产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ matrix.game }}
          path: ${{ runner.temp }}/crawl-out
          if-no-files-found: warn
          retention-days: 3

  # 阶段三：处理数据。合并全部游戏产物、合并未知内容 ID 登记、更新 meta 指针，
  # 最后只提交一次。任一游戏失败都不影响其他游戏的数据落库。
  process:
    name: 处理数据并落库
    needs: [prepare, crawl]
    if: always() && needs.prepare.outputs.should_crawl == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.persist.outputs.commit_sha }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 下载全部抓取产物
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: crawl-*
          path: ${{ runner.temp }}/crawl-merged
          merge-multiple: true

      - name: 合并数据、更新 meta 与未知 ID 登记
        working-directory: spider
        run: python3 crawl_artifacts.py merge --staging "${{ runner.temp }}/crawl-merged"

      - name: 提交数据
        id: persist
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.persist_data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spider/data spider/img spider/config
          if [ -z "$(git status --porcelain spider/data spider/img spider/config)" ]; then
            echo "没有新的卡池数据需要提交。"
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target_branch="${GITHUB_REF_NAME:-main}"
          git commit -m "更新卡池数据 [skip pages]"
          if git push origin "HEAD:${target_branch}"; then
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2; do
            echo "远端分支已有新提交，执行 rebase 后重试推送：第 ${attempt} 次"
            git pull --rebase origin "${target_branch}"
            if git push origin "HEAD:${target_branch}"; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "重试后仍无法推送，请检查远端分支是否持续有新提交或存在 rebase 冲突。"
          exit 1

  # 阶段四：构建站点。检出处理阶段刚推送的数据提交，保证页面用的就是本轮落库的数据。
  build:
    name: 构建静态站点
    needs: [prepare, process]
    if: always() && needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.process.outputs.commit_sha || github.sha }}

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 安装前端依赖
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: 检查前端代码
        working-directory: web
        run: npm run lint

      - name: 构建前端
        working-directory: web
        run: npm run build

      - name: 生成 SPA 404
        working-directory: web
        run: cp dist/index.html dist/404.html

      - name: 校验 Pages 产物
        working-directory: web
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          test -f dist/data/meta.json
          test -d dist/img

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
