[project]
name = "gachaclock-bot"
version = "0.1.0"
description = "GachaClock 微信查询机器人"
requires-python = ">=3.10,<4.0"
dependencies = [
  "nonebot-adapter-claweixin[login]==0.1.11",
  "nonebot2[httpx]==2.5.0",
  "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gachaclock_bot"]

[project.optional-dependencies]
test = [
  "coverage[toml]",
]

[tool.coverage.run]
branch = true
source = ["gachaclock_bot"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]
fail_under = 90
show_missing = true
